const EXP=`<div class="c exp"><p class="h">1 · ¿Qué es el rendimiento?</p><p>Es cuántos <b style="font-size:inherit">kilómetros</b> avanza la unidad con <b style="font-size:inherit">cada litro</b> de diesel. Se escribe <b style="font-size:inherit">km/L</b>.</p><p><b style="font-size:inherit">Rendimiento = km recorridos ÷ litros cargados</b></p><p>Ejemplo: si recorres 380 km y cargaste 100 litros, tu rendimiento es 380 ÷ 100 = <b style="font-size:inherit">3.8 km/L</b>. Mientras más km por litro, mejor: gastas menos diesel para hacer el mismo camino.</p></div>
<div class="c exp"><p class="h">2 · ¿Cuál es la meta?</p><p>Cada ruta tiene su propia meta, porque no es lo mismo una ruta plana que una con subidas, tráfico o muchas paradas. La tabla está en la pestaña “Rutas y metas”.</p><p>Hay dos números: la <b style="font-size:inherit">meta al 100%</b> (lo ideal) y la <b style="font-size:inherit">meta al 93%</b> (lo mínimo para cobrar el bono). Ejemplo en Amalucan: 3.80 km/L al 100% y 3.55 km/L al 93%. Es porque 3.80 × 0.93 ≈ 3.55.</p></div>
<div class="c exp"><p class="h">3 · ¿Cómo lo calcula este tablero?</p><ul><li><b style="font-size:inherit">El rol manda.</b> El tablero revisa quién tenía cada unidad cada día y a qué hora, y todo se liga a la persona, no al camión.</li><li><b style="font-size:inherit">Tramo entre cargas.</b> Se toma el diesel de una carga y se ve qué recorrió la unidad desde la carga anterior.</li><li><b style="font-size:inherit">Km reales.</b> Salen del GPS. <b style="font-size:inherit">Km programados</b> salen del rol.</li><li><b style="font-size:inherit">Meta ponderada.</b> Si en el mes hiciste varias rutas, tu meta es una mezcla según los km de cada una. Ejemplo: 100 km en una ruta de 3.8 y 100 km en una de 4.5 dan una meta de unos 4.1 km/L.</li><li><b style="font-size:inherit">% de la meta</b> = tu rendimiento ÷ tu meta × 100. Si te sale 95%, llegaste al 95% de lo ideal.</li><li><b style="font-size:inherit">Si dos operadores usaron la misma unidad</b> entre dos cargas, los litros se reparten según los km que hizo cada uno.</li></ul></div>
<div class="c exp"><p class="h">4 · Dos formas de gastar de más</p><ul><li><b style="font-size:inherit">Recorrer de más:</b> hiciste más km de los que marcaba el rol (desvíos, vueltas extra). Sale como “km de más”.</li><li><b style="font-size:inherit">Consumir de más:</b> hiciste los km correctos pero gastaste más litros de lo normal (acelerones, velocidad alta, motor encendido sin avanzar, falla mecánica). Sale como “km no rendidos”: son los km que ese diesel de más habría podido avanzar.</li></ul></div>
<div class="c exp"><p class="h">5 · ¿Qué significan los colores?</p><p><span class="p g">Verde</span> llegó al 100% de la meta o más y no hay nada raro. <span class="p y">Amarillo</span> cumple, pero hay algo que vigilar (por ejemplo km de más, o usó una unidad con GPS malo). <span class="p r">Rojo</span> quedó por debajo de la meta del bono.</p></div>
<div class="c exp"><p class="h">6 · Consejos para llegar al 100%</p><ul><li><b style="font-size:inherit">Arranca suave.</b> Pisa el acelerador poco a poco. Los acelerones gastan mucho diesel.</li><li><b style="font-size:inherit">Mira lejos.</b> Si ves un semáforo o un tope adelante, suelta el acelerador y deja que la unidad ruede, en vez de acelerar y frenar de golpe.</li><li><b style="font-size:inherit">Velocidad constante.</b> Ir muy rápido gasta mucho más. Mantén una velocidad pareja y dentro del límite.</li><li><b style="font-size:inherit">Cambia de velocidad a tiempo</b> y mantén el motor en la zona verde del tacómetro.</li><li><b style="font-size:inherit">No dejes el motor encendido sin necesidad.</b> Parada en la terminal, motor apagado si la espera es larga.</li><li><b style="font-size:inherit">Usa el freno de motor</b> en las bajadas en lugar de ir frenando todo el tiempo.</li><li><b style="font-size:inherit">Sigue tu ruta.</b> Los desvíos y las vueltas extra suman km y diesel.</li><li><b style="font-size:inherit">Avisa de fallas.</b> Humo negro, fugas, llantas bajas o frenos pegados hacen que la unidad gaste más. Repórtalo antes de salir.</li><li><b style="font-size:inherit">Carga bien.</b> Pide que se anote el kilometraje y los litros reales en cada carga.</li></ul></div>
<div class="c exp"><p class="h">7 · Pruébalo tú</p><div class="bar" style="border-width:2px;margin:0"><label>Km recorridos<input type="number" id="ckm" data-cal="1" value="380"></label><label>Litros cargados<input type="number" id="clt" data-cal="1" value="100"></label><label>Meta al 100% de tu ruta<input type="number" step="0.05" id="cmt" data-cal="1" value="3.8"></label></div><p id="calout" class="n" style="font-size:15px"></p></div>`;
